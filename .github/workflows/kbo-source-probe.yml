name: kbl-betman-cloud-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip -q install requests
      - name: Verify official read-only source reachability
        run: |
          python - <<'PY'
          import requests,json,sys,time
          from concurrent.futures import ThreadPoolExecutor
          from research.kbl_handicap_forward import sources
          base="https://m.betman.co.kr"
          h={**sources.BETMAN_HEADERS,"Referer":base+"/main/mainPage/gamebuy/buyableGameList.do"}
          queries=(("listing",sources.LIST_URL,sources.ROUND),("detail",sources.DETAIL_URL,{**sources.ROUND,"gmId":"G101","gmTs":"260133","gameYear":"2026"}))
          def read(item):
              name,url,payload=item
              start=time.monotonic()
              out={"source":name}
              try:
                  r=requests.post(url.replace("https://www.betman.co.kr",base),json=payload,headers=h,timeout=(5,10),allow_redirects=False)
                  out["status"]=r.status_code
                  if r.ok and name=="listing":
                      out["valid"]=isinstance(r.json().get("protoGames"),list)
                  if r.ok and name=="detail":
                      _,rows=sources.detail(r.content,"260133")
                      out["offers"]=[{k:row.get(k) for k in ("matchSeq","gameResult","mchScore","protoStatus","winHandi","winAllot","loseAllot")}
                                     for row in rows if row.get("matchSeq") in (3673,3730)]
              except (requests.RequestException,ValueError,KeyError) as exc: out["error"]=type(exc).__name__
              out["seconds"]=round(time.monotonic()-start,2)
              return out
          with ThreadPoolExecutor(max_workers=2) as pool:
              print("MOBILE_SOURCE "+json.dumps(list(pool.map(read,queries))))
          PY
