name: kbl-betman-cloud-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip -q install requests
      - name: Verify official read-only source reachability
        run: |
          python - <<'PY'
          import json, re, requests
          from urllib.parse import urljoin, urlsplit
          from research.kbl_handicap_forward import sources
          base="https://m.betman.co.kr"
          public=base+"/main/mainPage/gamebuy/buyableGameList.do"
          h={**sources.BETMAN_HEADERS,"Referer":public}
          def describe(r):
              info={"status":r.status_code,"content_type":r.headers.get("Content-Type",""),"size":len(r.content)}
              try:
                  d=r.json()
                  if isinstance(d,dict): info["keys"]=list(d)[:25]
              except ValueError:
                  info["scripts"]=re.findall(r"<script[^>]+src=[\x22\x27]([^\x22\x27]+)",r.text)[:20]
                  info["routes"]=sorted(set(re.findall(r"[/A-Za-z0-9_-]+\.do",r.text)))[:60]
              return info
          def fetch(name,url,payload=None):
              try:
                  r=requests.request("POST" if payload is not None else "GET",url,json=payload,
                                     headers=h,timeout=(5,8),allow_redirects=False)
                  print("MOBILE "+json.dumps({"route":name,**describe(r)}),flush=True)
                  return r
              except requests.RequestException as exc:
                  print("MOBILE "+json.dumps({"route":name,"error":type(exc).__name__}),flush=True)
          listing=fetch("public",public)
          for name,url,payload in (
              ("listing_api",sources.LIST_URL,sources.ROUND),
              ("detail_api",sources.DETAIL_URL,{**sources.ROUND,"gmId":"G101","gmTs":"260133","gameYear":"2026"}),
          ):
              fetch(name,base+urlsplit(url).path,payload)
          if listing and listing.ok:
              scripts=re.findall(r"<script[^>]+src=[\x22\x27]([^\x22\x27]+)",listing.text)
              for script in scripts:
                  url=urljoin(public,script)
                  if urlsplit(url).hostname=="m.betman.co.kr" and any(key in url.lower() for key in ("buyable","gamebuy","gameinfo")):
                      fetch("public_script",url)
          PY
