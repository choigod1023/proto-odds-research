name: watchdog
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: watchdog
  cancel-in-progress: false
env:
  APP_URL: https://proto-odds-collector.fly.dev
  LABEL: collector-down
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: DB 메타데이터 진단
        id: diag
        run: python src/collector_watchdog.py
      - name: 이상 보고
        if: steps.diag.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMS: ${{ steps.diag.outputs.problems }}
        run: |
          set -euo pipefail
          body="수집·판정 감시 결과 ($(date -u '+%Y-%m-%d %H:%MZ'))
          $PROBLEMS
          실행 로그: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          DB 생성 시각 기준입니다. Git 데이터 커밋 시각은 사용하지 않습니다."
          existing=$(gh issue list --label "$LABEL" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create "$LABEL" --color B60205 --description "수집기 이상" --force
            gh issue create --title "수집·판정 갱신 장애" --label "$LABEL" --body "$body"
          fi
      - name: 복구 확인
        if: steps.diag.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[].number')
          for n in $open; do
            gh issue close "$n" --comment "DB 점수·배당·판정 시각 및 디스크 여유가 경보 기준 안으로 복구됐습니다. 장기 무장애 판정은 아닙니다."
          done
