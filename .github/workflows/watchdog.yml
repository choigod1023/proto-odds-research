# 수집기 감시견
#
# 왜 필요했나 — 2026-08-06 15:39 에 수집기가 멈췄는데 **39시간을 몰랐다.**
# 볼륨(3GB)이 git loose object 2.67GiB 로 꽉 차서 모든 파일 쓰기가 ENOSPC 로
# 실패했다. 그런데 밖에서 보면 완벽히 건강해 보였다:
#   · fly 머신 STATE 는 계속 started
#   · /health 는 계속 200 "ok"
#   · live_scores.json 도 계속 갱신됨(같은 크기 덮어쓰기라 새 블록이 안 필요했다)
# 죽은 건 오직 "새 데이터 수집"과 "git push" 뿐이었고, 둘 다 조용히 죽었다.
# supervisor 의 push_data() 는 실패해도 로그 한 줄 찍고 넘어간다.
#
# 그래서 감시 기준은 **머신이 살아 있나**가 아니라 **데이터가 실제로 들어오나**다.
#
# ⚠️ 감시견을 fly 안에 두면 안 된다. 머신이 마비되면 감시견도 같이 죽어
#    아무도 알려주지 않는다. 그게 이번에 벌어진 일이다. 그래서 **바깥**에서 찌른다.
#
# 알림 경로 — 이슈를 열면 GitHub 가 저장소 소유자에게 메일을 보낸다.
# SMTP 자격증명도, 시크릿도, 비용도 필요 없다.
name: watchdog

on:
  schedule:
    - cron: "17 * * * *"     # 매시 17분. 정각은 러너가 붐벼 밀린다.
  workflow_dispatch:

permissions:
  contents: read
  issues: write              # 이슈 생성/코멘트 = 알림 경로

concurrency:
  group: watchdog
  cancel-in-progress: false

env:
  APP_URL: https://proto-odds-collector.fly.dev
  # 수집기는 30분마다 push 한다. 한두 주기 밀리는 건 정상이므로
  # 3시간(6주기)을 넘겼을 때만 사람을 부른다. 새벽에 헛알람으로 깨우지 않으려는 것.
  STALE_HOURS: 3
  LABEL: collector-down

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 마지막 데이터 커밋 시각을 봐야 한다

      - name: 진단
        id: diag
        run: |
          set -uo pipefail    # -e 는 쓰지 않는다. 점검이 실패해도 보고까지 가야 한다.

          problems=""
          add() { problems="${problems}- $1"$'\n'; }

          # ── 1. 데이터가 실제로 들어오고 있나 (가장 중요한 신호)
          # ⚠️ 작성자를 **수집기로 한정**한다. 그냥 docs/data/ 의 마지막 커밋을 보면
          #    사람이 손으로 만진 커밋에 신선도가 리셋된다. 2026-08-13 에 그랬다 —
          #    수집이 8/10 부터 멎어 있었는데 8/12 의 수동 커밋이 시계를 되돌려
          #    사흘 내내 알림이 안 떴다.
          #    여기서 답해야 할 질문은 "파일이 바뀌었나" 가 아니라
          #    **"수집기가 살아서 밀어 넣고 있나"** 다.
          # live_scores/live_odds만 바뀌어도 docs/data 전체 커밋 시각은 새것처럼
          # 보인다. 화면의 stale 판정과 같은 핵심 산출물인 picks_v2를 직접 본다.
          last=$(git log -1 --format=%ct --author=proto-collector -- docs/data/picks_v2.json || echo 0)
          now=$(date +%s)
          age_h=$(( (now - last) / 3600 ))
          echo "age_h=$age_h" >> "$GITHUB_OUTPUT"
          echo "마지막 데이터 커밋: ${age_h}시간 전"
          if [ "$age_h" -ge "$STALE_HOURS" ]; then
            add "**데이터가 ${age_h}시간째 안 들어옴** (정상은 30분 주기). 수집 또는 push 가 죽었다."
          fi

          # ── 2. 머신이 응답은 하나
          # 200 이어도 안심하면 안 된다. 이번 사고 때도 계속 200 이었다.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$APP_URL/health" || echo 000)
          echo "health=$code"
          if [ "$code" != "200" ]; then
            add "**/health 가 $code** — 머신이 응답하지 않는다."
          fi

          # ── 3. 실시간 점수가 늙지 않았나
          # git 을 안 거치고 머신이 직접 서빙하므로, 1번과 독립된 신호다.
          # 1번은 정상인데 이것만 늙었다면 live 스레드만 죽은 것이다.
          gen=$(curl -s --max-time 25 "$APP_URL/live_scores.json" \
                | sed -n 's/.*"generated_at": *"\([^"]*\)".*/\1/p' | head -1)
          if [ -z "$gen" ]; then
            add "**live_scores.json 을 읽을 수 없다** — 실시간 점수 경로가 끊겼다."
          else
            gen_s=$(date -d "$gen" +%s 2>/dev/null || echo 0)
            live_m=$(( (now - gen_s) / 60 ))
            echo "live_age_min=$live_m"
            # 3분 주기이므로 30분이면 확실히 이상하다
            if [ "$gen_s" -gt 0 ] && [ "$live_m" -ge 30 ]; then
              add "**실시간 점수가 ${live_m}분째 그대로** (정상은 3분 주기)."
            fi
          fi

          # ── 4. 디스크 여유 (이번 사고의 진짜 원인)
          # /health 가 disk_free_mb 를 실어 주면 터지기 **전에** 잡는다.
          # supervisor.py 에 이 필드를 추가하기 전까지는 이 점검이 자동으로 건너뛴다.
          free_mb=$(curl -s --max-time 25 "$APP_URL/health" \
                    | sed -n 's/.*"disk_free_mb": *\([0-9]*\).*/\1/p' | head -1)
          if [ -n "$free_mb" ]; then
            echo "disk_free_mb=$free_mb"
            if [ "$free_mb" -lt 300 ]; then
              add "**디스크 여유 ${free_mb}MB** — 300MB 미만. 이대로 두면 수집이 전부 멈춘다(2026-08-06 사고 재현)."
            fi
          fi

          # 멀티라인 출력은 구분자를 써야 한다
          {
            echo "problems<<EOF"
            printf '%s' "$problems"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$problems" ]; then echo "ok=false" >> "$GITHUB_OUTPUT"
          else echo "ok=true" >> "$GITHUB_OUTPUT"; fi

      # ── 이상: 이슈로 알린다 (= 메일)
      # 이미 열린 이슈가 있으면 새로 만들지 않고 코멘트만 단다.
      # 매시 도는 감시견이 이슈 24개를 쏟아내면 알림을 꺼 버리게 되고,
      # 그러면 감시견이 없는 것만 못하다.
      - name: 이상 보고
        if: steps.diag.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEMS: ${{ steps.diag.outputs.problems }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          수집기가 정상 동작하지 않는다. 감시견이 $(date -u '+%Y-%m-%d %H:%MZ') 에 감지했다.

          ## 증상
          $PROBLEMS

          ## 먼저 볼 것
          \`\`\`
          flyctl ssh console -a proto-odds-collector -C "df -h /data"
          flyctl logs -a proto-odds-collector --no-tail | tail -50
          \`\`\`

          디스크가 꽉 찼다면(2026-08-06 사고와 동일):
          \`\`\`
          flyctl ssh console -a proto-odds-collector -C "rm -f /data/repo/data/processed/games.csv /data/repo/data/processed/bets.csv"
          flyctl ssh console -a proto-odds-collector -C "git -C /data/repo gc --prune=now"
          \`\`\`
          두 CSV 는 untracked·derived 라 build_dataset.py 가 다시 만든다.

          _복구되면 이 이슈는 감시견이 스스로 닫는다._
          EOF
          )

          existing=$(gh issue list --label "$LABEL" --state open \
                     --json number --jq '.[0].number' || true)

          if [ -n "$existing" ]; then
            echo "이미 열린 이슈 #$existing — 코멘트만 단다"
            gh issue comment "$existing" --body "$body"
          else
            gh label create "$LABEL" --color B60205 --description "수집기 이상" 2>/dev/null || true
            gh issue create --title "🔴 수집기 멈춤 — 데이터가 안 들어온다" \
                            --label "$LABEL" --body "$body"
          fi

      # ── 정상: 열려 있던 이슈를 닫는다
      # 사람이 고쳤는데 이슈가 남아 있으면 다음 사고 때 "또 그거겠지" 하고 넘긴다.
      - name: 복구 확인
        if: steps.diag.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          open=$(gh issue list --label "$LABEL" --state open --json number --jq '.[].number' || true)
          for n in $open; do
            gh issue close "$n" --comment "✅ 복구 확인 — 데이터가 다시 들어온다 (마지막 커밋 ${{ steps.diag.outputs.age_h }}시간 전)."
          done
