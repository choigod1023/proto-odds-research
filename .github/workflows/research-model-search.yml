name: research-model-search
on:
  pull_request:
    paths:
      - 'experiments/nested-search-20261102/**'
      - 'tests/test_nested_search_pipeline.py'
      - 'tests/test_nested_ml_models.py'
      - 'tests/test_nested_residual_models.py'
      - 'requirements-research-models.txt'
      - '.github/workflows/research-model-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-research-models.txt
      - run: python -m pip install -r requirements-research-models.txt
      - name: Fixed candidate and leakage regression tests
        run: python -m pytest tests/test_nested_search_pipeline.py tests/test_nested_ml_models.py tests/test_nested_residual_models.py -q
      - name: Independent selected-forecast and Decimal settlement replay
        run: python experiments/nested-search-20261102/verify.py
