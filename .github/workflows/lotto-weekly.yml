name: lotto weekly preregistration

on:
  schedule:
    # 토요일 15:30 UTC = 일요일 00:30 KST, 공식 토요일 추첨 결과 공개 뒤
    - cron: "30 15 * * 6"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lotto-weekly
  cancel-in-progress: false

jobs:
  audit-and-preregister:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect official draws, audit, backtest, preregister
        run: >-
          python src/lotto_pipeline.py --data data/lotto/draws.jsonl all
          --refresh --budget 10000 --simulations 250
          --candidate-pool 5000 --uncertainty-samples 192
      - name: Commit append-only result
        run: |
          git config user.name "lotto-audit-bot"
          git config user.email "lotto-audit-bot@users.noreply.github.com"
          git add data/lotto docs/data/lotto_latest.json
          if git diff --cached --quiet; then
            echo "No new draw"
            exit 0
          fi
          git commit -m "data: preregister next Lotto 6/45 draw"
          git push
