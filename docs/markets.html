<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전 마켓 분석 — 승패·언더오버·핸디캡·승①패</title>
<meta name="description" content="한 경기의 모든 프로토 마켓(승패·언더오버·핸디캡·승①패)을 스코어 분포로 계산해 한 화면에서 비교한다.">
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --line:#e4e4e1; --line2:#efefec;
  --tx:#1a1a18; --tx2:#5c5c56; --tx3:#8a8a82;
  --neg:#b3261e; --pos:#1a7f4b; --warn:#9a6700; --accent:#2f4f8f;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14140f;--panel:#1c1c18;--line:#33332c;--line2:#26261f;
  --tx:#ecece4;--tx2:#a8a89e;--tx3:#77776e;
  --neg:#f2857c;--pos:#63c48d;--warn:#e0b341;--accent:#8fb0e8;}
}
:root[data-theme=dark]{--bg:#14140f;--panel:#1c1c18;--line:#33332c;--line2:#26261f;
  --tx:#ecece4;--tx2:#a8a89e;--tx3:#77776e;
  --neg:#f2857c;--pos:#63c48d;--warn:#e0b341;--accent:#8fb0e8;}
:root[data-theme=light]{--bg:#fbfbfa;--panel:#fff;--line:#e4e4e1;--line2:#efefec;
  --tx:#1a1a18;--tx2:#5c5c56;--tx3:#8a8a82;
  --neg:#b3261e;--pos:#1a7f4b;--warn:#9a6700;--accent:#2f4f8f;}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",
  "Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

nav{display:flex;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);
  font-size:14px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--tx2)}
nav a.on{color:var(--tx);font-weight:600;border-bottom:2px solid var(--tx);padding-bottom:3px}
.navnote{font-size:12px;color:var(--tx3);padding:10px 0 0;border-bottom:1px solid var(--line2)}

header{border-bottom:1px solid var(--line);margin-bottom:24px;padding:26px 0 20px}
h1{font-size:23px;margin:0 0 6px;letter-spacing:-.02em;font-weight:650}
.sub{color:var(--tx2);font-size:13.5px;margin:0}
.meta{margin-top:12px;font-size:12px;color:var(--tx3);display:flex;gap:16px;flex-wrap:wrap}

.notice{border:1px solid var(--line);border-left:3px solid var(--warn);
  background:var(--panel);padding:14px 16px;border-radius:3px;margin-bottom:22px}
.notice b{color:var(--warn)}
.notice p{margin:6px 0 0;font-size:13.5px;color:var(--tx2)}

.bar{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:18px;
  font-size:13px;color:var(--tx2)}
.bar label{display:flex;gap:6px;align-items:center}
select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:3px;
  background:var(--panel);color:var(--tx)}

.game{border:1px solid var(--line);border-radius:4px;background:var(--panel);
  margin-bottom:14px;overflow:hidden}
.ghead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  padding:12px 15px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.gteam{font-weight:650;font-size:15.5px}
.gwhen{font-size:12.5px;color:var(--tx3)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:3px;
  border:1px solid var(--line);color:var(--tx2);margin-left:6px}
.tag.pre{border-color:var(--accent);color:var(--accent)}
.tag.done{color:var(--tx3)}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 15px;border-bottom:1px solid var(--line2)}
th{font-size:11px;color:var(--tx3);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
tbody tr:last-child td{border-bottom:none}
tr.reco{background:color-mix(in srgb,var(--pos) 8%,transparent)}
tr.excl td{color:var(--tx3)}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.mk{font-weight:600}
.why{font-size:11.5px;color:var(--tx3)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.badge{font-size:10.5px;padding:1px 6px;border-radius:3px;background:var(--pos);color:#fff}
.empty{padding:40px 0;text-align:center;color:var(--tx3)}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);
  font-size:12px;color:var(--tx3)}
@media(max-width:640px){
  th:nth-child(5),td:nth-child(5){display:none}
  .wrap{padding:0 14px 60px}
}
</style>
</head>
<body>
<div class="wrap">

<nav>
  <a href="index.html">가격 분석</a>
  <a href="markets.html" class="on">전 마켓</a>
  <a href="picks.html">오늘의 픽</a>
  <a href="research.html">연구 현황</a>
</nav>
<div class="navnote">
  <b>가격 분석</b> 회차 환급률·상품별 유불리 ·
  <b>전 마켓</b> 한 경기의 모든 마켓을 한눈에(이 페이지) ·
  <b>오늘의 픽</b> 승패 단일 추천과 성적 ·
  <b>연구 현황</b> 시장을 이길 수 있는가
</div>

<header>
  <h1>전 마켓 분석</h1>
  <p class="sub">한 경기에 걸린 <b>승패 · 언더오버 · 핸디캡 · 승①패</b>를 스코어 분포로 한꺼번에 계산해 비교한다.</p>
  <div class="meta" id="meta"></div>
</header>

<div class="notice" id="warn"></div>

<div class="bar">
  <label>상태 <select id="fst">
    <option value="경기전">경기전</option>
    <option value="">전체</option>
    <option value="정산">정산 완료</option>
  </select></label>
  <label>리그 <select id="flg"><option value="">전체</option></select></label>
  <label>마켓 <select id="fmk"><option value="">전체</option></select></label>
  <label><input type="checkbox" id="fre"> 추천만 보기</label>
</div>

<div id="list"></div>

<footer>
  데이터 <span class="mono" id="gen"></span> ·
  <a href="https://github.com/choigod1023/proto-odds-research">choigod1023/proto-odds-research</a><br>
  프로토 구매는 오프라인 판매점과 betman.co.kr 에서만 가능합니다. 이 페이지는 정보 제공용입니다.
</footer>

</div>
<script>
const pct = v => (v==null ? "–" : (v*100).toFixed(1)+"%");
const sgn = v => (v==null ? "–" : (v>=0?"+":"")+(v*100).toFixed(1)+"%");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

let DATA=null;

function optName(o){
  const lb = o.label ? " "+o.label : "";
  return esc(o.market + lb + " · " + o["선택"]);
}

function render(){
  const st=fst.value, lg=flg.value, mk=fmk.value, onlyReco=fre.checked;
  const pool=[...(DATA.live||[]),...(DATA.past||[])];
  const games=pool.filter(g=>(!st||g.status===st)&&(!lg||g.league===lg));
  const out=[];
  for(const g of games){
    let opts=(g.options||[]).filter(o=>!mk||o.market===mk);
    if(onlyReco) opts=opts.filter(o=>o["추천점수"]!=null);
    if(!opts.length) continue;
    const done=g.status!=="경기전";
    out.push(`<div class="game">
      <div class="ghead">
        <div><span class="gteam">${esc(g.home)} vs ${esc(g.away)}</span>
          <span class="tag ${done?"done":"pre"}">${esc(g.status)}</span>
          <span class="tag">${esc(g.league)}</span>
          ${g["판단"]?`<span class="tag">${esc(g["판단"])}</span>`:""}</div>
        <div class="gwhen">${esc(g.date)} · ${g.round}회차 ·
          모델 홈승률 <span class="mono">${pct(g["홈승률"])}</span></div>
      </div>
      <table><thead><tr>
        <th>마켓 / 선택</th><th style="text-align:right">배당</th>
        <th style="text-align:right">시장</th><th style="text-align:right">모델</th>
        <th style="text-align:right">예상손익</th><th>판단</th>
      </tr></thead><tbody>
      ${opts.map(o=>{
        const reco=o["추천점수"]!=null, ev=o["예상손익"];
        const cls=reco?"reco":(o["제외"]?"excl":"");
        const hit=o["적중"]===true?' <span class="badge">적중</span>':
                  o["적중"]===false?' <span class="tag">미적중</span>':"";
        return `<tr class="${cls}">
          <td><span class="mk">${optName(o)}</span>${hit}</td>
          <td class="num">${o["배당"]??"–"}</td>
          <td class="num">${pct(o["시장확률"])}</td>
          <td class="num">${pct(o["모델확률"])}</td>
          <td class="num ${ev>=0?"pos":"neg"}">${sgn(ev)}</td>
          <td class="why">${reco?"<b>추천</b>":esc(o["제외"]||"")}</td>
        </tr>`;}).join("")}
      </tbody></table></div>`);
  }
  list.innerHTML = out.length? out.join("") :
    `<div class="empty">조건에 맞는 경기가 없습니다.</div>`;
}

fetch("data/picks_v2.json?"+Date.now()).then(r=>r.json()).then(d=>{
  DATA=d;
  gen.textContent=(d.generated_at||"").replace("T"," ").replace("+00:00"," UTC");
  const pool=[...(d.live||[]),...(d.past||[])];
  const t=d.tally||{};
  meta.innerHTML=[
    `경기 <b>${pool.length}</b>건 (예정 ${(d.live||[]).length})`,
    `회차 ${(d.rounds||[]).join(", ")}`,
    t.n?`정산 표본 ${t.n}건 · 적중 ${(t.hit_rate*100).toFixed(1)}% · 수익률 ${sgn(t.roi)}`:""
  ].filter(Boolean).join(" · ");
  warn.innerHTML=`<b>읽기 전에</b><p>${esc(d.warning||"")}</p>
    <p style="color:var(--tx3);font-size:12.5px">${esc(d.note||"")}
    모델과 시장의 차이가 ${((d.gap_cap??0)*100).toFixed(0)}%p 를 넘으면 신뢰가 낮다고 보고 제외한다.</p>`;
  const leagues=[...new Set(pool.map(g=>g.league))].sort();
  flg.innerHTML='<option value="">전체</option>'+leagues.map(l=>`<option>${esc(l)}</option>`).join("");
  const mks=[...new Set(pool.flatMap(g=>(g.options||[]).map(o=>o.market)))].sort();
  fmk.innerHTML='<option value="">전체</option>'+mks.map(m=>`<option>${esc(m)}</option>`).join("");
  [fst,flg,fmk,fre].forEach(el=>el.addEventListener("change",render));
  render();
}).catch(e=>{list.innerHTML=`<div class="empty">데이터를 불러오지 못했습니다: ${esc(e.message)}</div>`;});
</script>
</body>
</html>
