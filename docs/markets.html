<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경기 분석 — 오늘 뭘 사면 덜 잃나</title>
<meta name="description" content="발매 중인 프로토 전 마켓을 과거 실측 수익률로 등급화하고, 목표 배당별로 가장 덜 잃는 조합을 보여준다. 예측이 아니라 손실 축소 도구다.">
<style>
:root{
  --bg:#fbfbfa; --panel:#fff; --line:#e4e4e1; --line2:#efefec;
  --tx:#1a1a18; --tx2:#5c5c56; --tx3:#8a8a82;
  --neg:#b3261e; --pos:#1a7f4b; --warn:#9a6700; --accent:#2f4f8f;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14140f;--panel:#1c1c18;--line:#33332c;--line2:#26261f;
  --tx:#ecece4;--tx2:#a8a89e;--tx3:#77776e;
  --neg:#f2857c;--pos:#63c48d;--warn:#e0b341;--accent:#8fb0e8;}
}
:root[data-theme=dark]{--bg:#14140f;--panel:#1c1c18;--line:#33332c;--line2:#26261f;
  --tx:#ecece4;--tx2:#a8a89e;--tx3:#77776e;
  --neg:#f2857c;--pos:#63c48d;--warn:#e0b341;--accent:#8fb0e8;}
:root[data-theme=light]{--bg:#fbfbfa;--panel:#fff;--line:#e4e4e1;--line2:#efefec;
  --tx:#1a1a18;--tx2:#5c5c56;--tx3:#8a8a82;
  --neg:#b3261e;--pos:#1a7f4b;--warn:#9a6700;--accent:#2f4f8f;}

/* ── 기본 ────────────────────────────────────────────────────────── */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo",
  "Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:960px;margin:0 auto;padding:0 20px 80px}
a{color:var(--accent)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
h1{font-size:22px;margin:22px 0 4px;letter-spacing:-.01em}
.sub{color:var(--tx2);font-size:13.5px;margin:0}
.meta{color:var(--tx3);font-size:11.5px;margin-top:6px}

nav{display:flex;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);
  font-size:14px;flex-wrap:wrap}
nav a{text-decoration:none;color:var(--tx2)}
nav a.on{color:var(--tx);font-weight:600;border-bottom:2px solid var(--tx);padding-bottom:3px}

/* ── 카드: 페이지의 모든 블록이 같은 규칙을 쓴다 ───────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.sec{margin:28px 0 10px;display:flex;align-items:baseline;gap:9px}
.sec h2{font-size:15px;margin:0;letter-spacing:-.01em}
.sec .note{font-size:11.5px;color:var(--tx3)}

/* ── 히어로: 오늘 살 것 ────────────────────────────────────────────── */
.hero{padding:16px 18px;margin-top:18px}
.hero .q{font-size:12px;color:var(--tx3);letter-spacing:.02em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 14px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;
  padding:6px 13px;font:inherit;font-size:12px;color:var(--tx2);cursor:pointer;
  display:flex;align-items:center;gap:6px;line-height:1}
.tab:hover{border-color:var(--tx3)}
.tab.on{border-color:var(--tx);color:var(--tx);font-weight:600}
.tab .e{font-family:var(--mono);font-size:11px;color:var(--tx3)}
.tab.on .e{color:var(--neg)}
.stats{display:flex;gap:26px;flex-wrap:wrap;padding-bottom:12px;
  border-bottom:1px solid var(--line2)}
.stat .k{font-size:11px;color:var(--tx3)}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1.35}
.stat .v.neg{color:var(--neg)}
.stat .v.sm{font-size:14px}
.legs{margin-top:12px}
.leg{display:flex;align-items:baseline;gap:9px;padding:7px 0;font-size:13px;
  border-top:1px solid var(--line2);flex-wrap:wrap}
.leg:first-child{border-top:0}
.leg .t{font-family:var(--mono);font-size:11.5px;color:var(--tx3);min-width:38px}
.leg .lg{font-size:10.5px;color:var(--tx3);border:1px solid var(--line);
  border-radius:4px;padding:1px 5px}
.leg .m{flex:1;min-width:170px}
.leg .o{font-family:var(--mono);font-weight:600}
.leg .x{font-size:10.5px;color:var(--pos)}
.hero .foot{margin-top:12px;padding-top:11px;border-top:1px solid var(--line2);
  font-size:12px;color:var(--tx2);line-height:1.75}
.hero .foot b{color:var(--tx)}

/* ── 필터 ────────────────────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:9px 0;
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2)}
.bar select,.bar input[type=search]{font:inherit;font-size:12px;padding:4px 7px;
  background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:6px}
.bar label{display:flex;align-items:center;gap:5px}

/* ── 경기 목록 ───────────────────────────────────────────────────── */
.lgh{font-size:11px;color:var(--tx3);font-weight:600;letter-spacing:.03em;margin:18px 0 6px}
.g{margin:6px 0}
.g>summary{cursor:pointer;list-style:none;padding:10px 12px;display:flex;
  align-items:center;gap:11px;flex-wrap:wrap}
.g>summary::-webkit-details-marker{display:none}
.g[open]{border-color:var(--tx3)}
.g[open]>summary{border-bottom:1px solid var(--line2)}
.g .t{font-family:var(--mono);font-size:11.5px;color:var(--tx3);min-width:40px}
.g .n{font-size:13.5px;font-weight:600;flex:1;min-width:160px}
.g .n s{color:var(--tx3);text-decoration:none;font-weight:400;font-size:12px}
.g .r{font-size:10.5px;color:var(--tx3);white-space:nowrap}
.obs{display:flex;gap:5px}
.ob{display:flex;flex-direction:column;align-items:center;min-width:56px;
  border:1px solid var(--line);border-radius:7px;padding:4px 8px}
.ob .l{font-size:9.5px;color:var(--tx3);letter-spacing:.03em}
.ob .v{font-family:var(--mono);font-size:12.5px;font-weight:600;line-height:1.35}
.ob.A{border-color:var(--pos)}.ob.B{border-color:var(--accent)}
.ob.C{border-color:var(--warn)}.ob.D{border-color:var(--neg)}
.ob.U{border-style:dashed}
.body{padding:10px 12px 12px}
.wait{font-size:12px;color:var(--tx3);padding:8px 10px;border:1px dashed var(--line);
  border-radius:7px}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--tx3);font-size:11px;
  padding:0 8px 5px 0;border-bottom:1px solid var(--line2)}
td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line2);vertical-align:baseline}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.gr{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;
  border-radius:4px;color:#fff;font-size:10px;font-weight:700;margin-right:7px}
.grA{background:var(--pos)}.grB{background:var(--accent)}
.grC{background:var(--warn)}.grD{background:var(--neg)}
.grU{background:transparent;border:1px dashed var(--tx3);color:var(--tx3)}
.grT{background:var(--tx3)}
.mcol{display:none}
body.mon .mcol{display:table-cell}
.why{border-top:1px solid var(--line2);margin-top:10px;padding-top:10px;
  font-size:12.5px;color:var(--tx2);line-height:1.75}
.why .f{margin-top:6px;font-size:11.5px;color:var(--tx3)}
.empty{color:var(--tx3);padding:26px 0;text-align:center;font-size:13px}

/* ── 근거 ────────────────────────────────────────────────────────── */
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.more a{display:block;padding:13px 15px;text-decoration:none;color:inherit}
.more .h{font-size:13px;font-weight:600;margin-bottom:3px}
.more .d{font-size:11.5px;color:var(--tx3);line-height:1.65}
.warnline{font-size:11.5px;color:var(--tx3);margin-top:12px;line-height:1.75}
.warnline b{color:var(--neg)}
</style>
</head>
<body>
<div class="wrap">

<nav>
  <a href="index.html">가격 분석</a>
  <a href="markets.html" class="on">경기 분석</a>
  <a href="research.html">연구 현황</a>
</nav>

<header>
  <h1>경기 분석</h1>
  <p class="sub">발매 중인 전 마켓을 <b>과거 실측 수익률</b>로 등급화한다.
    예측이 아니라 <b>덜 잃는 선택</b>이다.</p>
  <div class="meta" id="meta"></div>
</header>

<!-- ① 오늘 살 것 — 이 페이지에서 실제로 쓸 수 있는 유일한 것 -->
<section class="card hero">
  <div class="q">오늘 살 거면</div>
  <div class="tabs" id="tabs"></div>
  <div id="plan"></div>
  <div class="foot" id="foot"></div>
</section>

<!-- ② 경기 -->
<div class="sec"><h2>경기</h2><span class="note" id="cnt"></span></div>
<div class="bar">
  <label>상태 <select id="fst">
    <option value="예정">예정</option>
    <option value="경기전">배당 나옴</option>
    <option value="배당대기">배당 대기</option>
    <option value="정산">정산</option>
    <option value="">전체</option>
  </select></label>
  <label>리그 <select id="flg"><option value="">전체</option></select></label>
  <label>마켓 <select id="fmk"><option value="">전체</option></select></label>
  <label>회차 <select id="frd"><option value="">전체</option></select></label>
  <label><input id="fq" type="search" placeholder="팀 검색" style="width:120px"></label>
  <label><input type="checkbox" id="fmo"> 모델 수치</label>
</div>
<div id="list"></div>

<!-- ③ 근거 — 접지 않고 연구 페이지로 보낸다 -->
<div class="sec"><h2>근거</h2><span class="note">숫자의 출처</span></div>
<div class="more">
  <div class="card"><a href="research.html">
    <div class="h">배당대 등급</div>
    <div class="d" id="m1">실측 수익률로 A~D 를 매긴다. 네 해 모두 같은 방향일 때만 등급을 준다.</div>
  </a></div>
  <div class="card"><a href="research.html">
    <div class="h">조합 산술</div>
    <div class="d">다리를 하나 더 붙일 때마다 마진이 한 번 더 물린다 — 약 −6%p.
      목표 배당은 다리 수가 아니라 다리당 배당으로 맞춘다.</div>
  </a></div>
  <div class="card"><a href="research.html">
    <div class="h">왜 이길 수 없나</div>
    <div class="d">12개 검증 기록. 필요한 우위 6.8%p, 동원 가능한 정보 4.8%p.</div>
  </a></div>
</div>
<div class="warnline" id="warn"></div>

</div>
<script>
const pct=v=>(v==null?"–":(v*100).toFixed(1)+"%");
const sgn=v=>(v==null?"–":(v>=0?"+":"")+(v*100).toFixed(1)+"%");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const od=v=>(v==null?"–":Number(v).toFixed(2));
const gcls=g=>(g==="?"?"U":g);          // '?' 는 CSS 클래스명이 못 된다

let DATA=null, GRADES=null, PLANS=[], SOLO=null;
const $=id=>document.getElementById(id);

function grade(o){
  if(!GRADES||o==null) return null;
  for(const g of GRADES.odds_bins){
    const [lo,hi]=g.bin.replace("+","-999").split("-").map(Number);
    if(o>=lo&&o<hi) return g;
  }
  return null;
}
function optName(o){ return esc(o.market+(o.label?" "+o.label:"")+" · "+o["선택"]); }
function form(f){
  if(!f) return "";
  const b=[`${f.w}승${f.l}패`];
  if(f.streak) b.push(f.streak);
  if(f.last10) b.push(`최근10 ${f.last10}`);
  if(f.avg_scored!=null) b.push(`${f.avg_scored}득 ${f.avg_conceded}실`);
  return b.join(" · ");
}

/* ── 오늘 살 것 ───────────────────────────────────────────────────── */
function legRow(c){
  return `<div class="leg">
    <span class="t">${esc(String(c.date).slice(-5))}</span>
    <span class="lg">${esc(c.league)}</span>
    <span class="m">${esc(c.match)} — <b>${esc(c.market)}${c.market_label?" "+esc(c.market_label):""} ${esc(c.sel)}</b></span>
    <span class="o">${od(c.odds)}</span>
    ${c.beats?`<span class="x">${c.round}회차가 유리 (${c.beats.round}회차 ${od(c.beats.odds)})</span>`:""}
  </div>`;
}
function showPlan(i){
  $("tabs").innerHTML =
    (SOLO?`<button class="tab${i<0?" on":""}" onclick="showPlan(-1)">단폴</button>`:"")+
    PLANS.map((p,k)=>`<button class="tab${k===i?" on":""}" onclick="showPlan(${k})">${p.target}배<span class="e">${(p.expected_roi*100).toFixed(0)}%</span></button>`).join("");
  if(i<0&&SOLO){
    $("plan").innerHTML=`<div class="stats">
      <div class="stat"><div class="k">배당</div><div class="v">${od(SOLO.odds)}</div></div>
      <div class="stat"><div class="k">환급률</div><div class="v">${SOLO.payout}%</div></div>
      <div class="stat"><div class="k">구매 조건</div><div class="v sm">'한경기' 지정 경기만</div></div>
    </div><div class="legs">${legRow(SOLO)}</div>`;
    return;
  }
  const p=PLANS[i];
  if(!p){ $("plan").innerHTML=`<div class="empty">발매 중인 조합이 없다</div>`; return; }
  $("plan").innerHTML=`<div class="stats">
    <div class="stat"><div class="k">실배당</div><div class="v">${p.actual_odds.toFixed(2)}×</div></div>
    <div class="stat"><div class="k">적중 확률</div><div class="v">${(p.hit_est*100).toFixed(1)}%</div></div>
    <div class="stat"><div class="k">기대 수익률</div><div class="v neg">${(p.expected_roi*100).toFixed(1)}%</div></div>
    <div class="stat"><div class="k">구성</div><div class="v">${p.legs}폴</div></div>
  </div><div class="legs">${p.picks.map(legRow).join("")}</div>`;
}

/* ── 경기 목록 ────────────────────────────────────────────────────── */
function whyBox(g){
  const f=[];
  const s=g["선발"];
  if(s&&(s.home||s.away)) f.push(`선발 ${esc(g.home)} ${esc(s.home||"?")} / ${esc(g.away)} ${esc(s.away||"?")}`);
  if(g["h2h"]) f.push(esc(g["h2h"]));
  const fh=form(g.form_home), fa=form(g.form_away);
  if(fh) f.push(`${esc(g.home)} ${esc(fh)}`);
  if(fa) f.push(`${esc(g.away)} ${esc(fa)}`);
  if(g.lam_src==="풀링") f.push("λ는 리그 표본을 끌어와 추정 — 컵대회는 모델이 더 부정확하다");
  if(!g["해설"]&&!f.length) return "";
  return `<div class="why">${g["해설"]?esc(g["해설"]):""}${f.length?`<div class="f">${f.join(" · ")}</div>`:""}</div>`;
}
function render(){
  const st=$("fst").value, lg=$("flg").value, mk=$("fmk").value,
        rd=$("frd").value, q=($("fq").value||"").trim().toLowerCase();
  const pool=[...(DATA.live||[]),...(DATA.past||[])];
  const games=pool.filter(g=>
      (!st || (st==="예정" ? (g.status==="경기전"||g.status==="배당대기") : g.status===st))
    &&(!lg||g.league===lg) &&(!rd||String(g.round)===rd)
    &&(!q||[g.home,g.away,g.league].join(" ").toLowerCase().includes(q)));
  const out=[]; let cur=null, n=0;
  for(const g of games){
    const opts=(g.options||[]).filter(o=>!mk||o.market===mk);
    const wait=g.status==="배당대기";
    if(!opts.length&&!wait) continue;
    if(wait&&mk) continue;
    n++;
    const key=`${g.league} · ${String(g.date).slice(0,8)}`;
    if(key!==cur){ cur=key; out.push(`<div class="lgh">${esc(key)}</div>`); }

    const head=opts.filter(o=>o.market==="승패"||o.market==="승무패");
    const shown=(head.length?head:opts).slice(0,3);
    const obs=wait
      ? `<span class="ob U"><span class="l">배당</span><span class="v">대기</span></span>`
      : shown.map(o=>{const gr=grade(o["배당"]);
          return `<span class="ob ${gr?gcls(gr.grade):"U"}" title="${gr?`배당 ${gr.bin} 실측 ${(gr.roi*100).toFixed(1)}%`:"등급 없음"}"><span class="l">${esc(o["선택"])}</span><span class="v">${od(o["배당"])}</span></span>`;}).join("");

    // 같은 마켓의 두 선택지가 같은 등급이면 '=' — 어느 쪽을 사도 같아 고를 근거가 없다
    const tie={}, byMk={};
    opts.forEach(o=>{const k=o.market+(o.label||""), gr=grade(o["배당"]);
      (byMk[k]=byMk[k]||[]).push(gr&&gr.grade);});
    Object.entries(byMk).forEach(([k,v])=>{ if(v.length===2&&v[0]&&v[0]===v[1]) tie[k]=true; });

    out.push(`<details class="card g"><summary>
      <span class="t">${esc(String(g.date).slice(-5))}</span>
      <span class="n">${esc(g.home)} <s>vs</s> ${esc(g.away)}</span>
      <span class="obs">${obs}</span>
      <span class="r">${g.round}회차${g["판단"]?" · "+esc(g["판단"]):""}</span>
    </summary><div class="body">
      ${wait?`<div class="wait">배당이 아직 발표되지 않았다. 프로토는 <b>경기 목록을 먼저 열고 배당을 나중에 붙인다.</b></div>`
      :`<table><thead><tr>
        <th>마켓 / 선택</th><th style="text-align:right">배당</th>
        <th class="mcol" style="text-align:right">시장</th>
        <th class="mcol" style="text-align:right">모델</th>
        <th class="mcol" style="text-align:right">기대</th>
      </tr></thead><tbody>${opts.map(o=>{
        const gr=grade(o["배당"]), ev=o["예상손익"], t=tie[o.market+(o.label||"")];
        const b=gr?(t?`<span class="gr grT" title="양쪽이 같은 배당대(${gr.bin}) — 고를 근거가 없다">=</span>`
                     :`<span class="gr gr${gcls(gr.grade)}" title="배당 ${gr.bin} 실측 ${(gr.roi*100).toFixed(1)}%">${gr.grade}</span>`):"";
        const hit=o["적중"]===true?" ✔":o["적중"]===false?" ✕":"";
        return `<tr><td>${b}${optName(o)}${hit}</td>
          <td class="num">${od(o["배당"])}</td>
          <td class="num mcol">${pct(o["시장확률"])}</td>
          <td class="num mcol">${pct(o["모델확률"])}</td>
          <td class="num mcol">${sgn(ev)}</td></tr>`;}).join("")}
      </tbody></table>`}
      ${whyBox(g)}
    </div></details>`);
  }
  $("list").innerHTML = out.length?out.join(""):`<div class="empty">조건에 맞는 경기가 없다</div>`;
  $("cnt").textContent = `${n}경기`;
}

/* ── 로드 ─────────────────────────────────────────────────────────── */
Promise.all([
  fetch("data/picks_v2.json?"+Date.now()).then(r=>r.json()),
  fetch("data/loss_grades.json?"+Date.now()).then(r=>r.json()).catch(()=>null),
  fetch("data/combo.json?"+Date.now()).then(r=>r.json()).catch(()=>null),
  fetch("data/today_combo.json?"+Date.now()).then(r=>r.json()).catch(()=>null),
]).then(([d,lg,cb,tc])=>{
  DATA=d; GRADES=lg;
  if(tc){ PLANS=(tc.plans||[]).filter(p=>p.ok); SOLO=tc.solo||null; showPlan(0); }

  if(lg&&cb){
    const bl=(cb.baseline||[]).find(x=>x.legs===2)||{};
    const A=(lg.odds_bins||[]).find(x=>x.grade==="A");
    $("foot").innerHTML=`아무 2폴 <b class="mono">${(bl.any*100).toFixed(1)}%</b> &rarr;
      배당 ${A?A.bin:"1.0-1.3"} 로 짠 2폴 <b class="mono">${(bl.best*100).toFixed(1)}%</b>
      — <b>${(bl.saving*100).toFixed(1)}%p 덜 잃는다.</b>
      전부 마이너스다. 목표 배당을 올릴수록 더 잃는다.`;
    if(lg.basis) $("m1").textContent=
      `실측 ${lg.basis.n_selections.toLocaleString()}건 · ${lg.basis.years[0]}~${lg.basis.years.at(-1)}. `+
      `네 해 모두 같은 방향일 때만 등급을 준다.`;
  }
  if(d.tally){
    const t=d.tally;
    $("warn").innerHTML=`모델 수치는 <b>참고용이다.</b> 이 페이지의 모델 추천을 그대로 따랐다면
      정산 ${t.n}건에서 적중 ${(t.hit_rate*100).toFixed(1)}%, 수익률 <b>${(t.roi*100).toFixed(1)}%</b> 였다 —
      아무거나 살 때(−13.7%)보다 나쁘다. 모델이 시장보다 부정확해서, 격차가 큰 곳은 곧 모델이 크게 틀린 곳이다.`;
  }
  $("meta").textContent=`${(d.live||[]).length+(d.past||[]).length}경기 · 회차 ${(d.rounds||[]).join(", ")}`+
    ` · 갱신 ${String(d.generated_at||"").slice(0,16).replace("T"," ")}`;

  const pool=[...(d.live||[]),...(d.past||[])];
  const uniq=a=>[...new Set(a)].filter(v=>v!=null&&v!=="");
  $("flg").innerHTML='<option value="">전체</option>'+
    uniq(pool.map(g=>g.league)).sort().map(x=>`<option>${esc(x)}</option>`).join("");
  $("fmk").innerHTML='<option value="">전체</option>'+
    uniq(pool.flatMap(g=>(g.options||[]).map(o=>o.market))).sort().map(x=>`<option>${esc(x)}</option>`).join("");
  $("frd").innerHTML='<option value="">전체</option>'+
    uniq(pool.map(g=>g.round)).sort((a,b)=>b-a).map(x=>`<option value="${x}">${x}회차</option>`).join("");

  ["fst","flg","fmk","frd"].forEach(id=>$(id).addEventListener("change",render));
  $("fq").addEventListener("input",render);
  $("fmo").addEventListener("change",e=>document.body.classList.toggle("mon",e.target.checked));
  render();
}).catch(e=>{$("list").innerHTML=`<div class="empty">데이터를 불러오지 못했습니다: ${esc(e.message)}</div>`;});
</script>
</body>
</html>
