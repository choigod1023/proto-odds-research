# Read-only edge. No Python, database, generator, or collector credentials.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_max_body_size 32k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 15s;
    proxy_temp_path /var/cache/nginx/temp;
    client_body_temp_path /var/cache/nginx/client;
    fastcgi_temp_path /var/cache/nginx/fastcgi;
    uwsgi_temp_path /var/cache/nginx/uwsgi;
    scgi_temp_path /var/cache/nginx/scgi;
    proxy_cache_path /var/cache/nginx/responses levels=1:2 keys_zone=responses:2m
                     max_size=64m inactive=24h use_temp_path=off;
    # Runtime DNS resolution allows the collector to restart/change IP.
    resolver 1.1.1.1 1.0.0.1 valid=30s;
    map $arg_scope $scope { "" recent; default $arg_scope; }
    map $uri $response_key {
        default $uri;
        /api/matches "$uri?scope=$scope";
        /api/match-detail "$uri?key=$arg_key&revision=$arg_revision";
    }
    map $http_accept_encoding $encoding { default identity; ~*gzip gzip; }
    server {
        listen 8080;
        set $collector https://proto-odds-collector.fly.dev;
        proxy_ssl_server_name on;
        proxy_ssl_name proto-odds-collector.fly.dev;
        proxy_ssl_verify on;
        # Fly's public chain can contain more than one intermediate CA.
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host proto-odds-collector.fly.dev;
        proxy_set_header Accept-Encoding $encoding;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        proxy_send_timeout 5s;
        proxy_next_upstream off;
        proxy_buffer_size 8k;
        proxy_buffers 4 16k;
        proxy_max_temp_file_size 64m;

        # Fly checks web process availability here, NOT collector freshness.
        location = /readyz {
            default_type application/json;
            return 200 '{"status":"ok","role":"web-edge","data_freshness":"check collector /health"}';
        }
        # Never turn collector failure into cached healthy status.
        location = /health { proxy_pass $collector$request_uri; }
        # Anonymous submissions are writes: no cache and no automatic retry.
        location = /anonymous-bets { proxy_pass $collector$request_uri; }

        location ~ ^/(api/(matches|match-detail|live-scores|live-odds|today-recommendations|picks|loss-grades)|live_scores\.json|live_odds\.json|today_combo\.json|picks_v2\.json)$ {
            limit_except GET OPTIONS { deny all; }
            proxy_pass $collector$request_uri;
            proxy_cache responses;
            # Browser timestamp cache-busters do not create unlimited edge keys.
            # Semantic scope/key/revision AND wire encoding remain distinct.
            proxy_cache_key "$response_key|$encoding";
            proxy_cache_valid 200 5s;
            proxy_ignore_headers Cache-Control Expires;
            proxy_hide_header Cache-Control;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 6s;
            proxy_cache_lock_age 6s;
            proxy_cache_background_update on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            # 409/404 are not masked by stale fallback or cached as success.
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
            add_header X-Response-Cache $upstream_cache_status always;
            add_header X-Origin-Date $upstream_http_date always;
            add_header Access-Control-Expose-Headers "X-Response-Cache, X-Origin-Date" always;
        }
        location / { return 404; }
    }
}
