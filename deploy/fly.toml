# 상시 수집 워커 + **실시간 점수 배달용 초소형 HTTP**.
#
# 원래는 포트를 안 열었다. 그런데 실시간 점수는 3분마다 바뀌는데 git push 는
# 30분 주기다 — 그 경로로는 실시간이 될 수 없고, 3분마다 커밋하면 하루 300커밋으로
# 레포가 망가진다. 그래서 이 파일 하나만 머신이 직접 서빙한다.
# (브라우저가 네이버 API 를 직접 부르는 건 CORS 로 막힌다.)
app = "proto-odds-collector"
primary_region = "nrt"          # 도쿄 — fly 에 한국 리전이 없어 국내 사이트에 가장 가깝다

# dockerfile 경로는 이 파일 위치(deploy/) 기준이고, COPY 의 기준이 되는
# 빌드 컨텍스트는 fly deploy 를 실행한 디렉터리다. Dockerfile 이 requirements.txt 를
# 레포 루트에서 집으므로 **반드시 레포 루트에서** 배포할 것:
#   fly deploy -c deploy/fly.toml
[build]
  dockerfile = "Dockerfile"

[env]
  REPO_DIR = "/data/repo"
  TZ = "Asia/Seoul"

# 볼륨 — 재시작해도 살아남는 디스크. 여기에 레포를 클론해 두고 돌린다.
# (진짜 백업은 git push. 볼륨은 이 머신에만 붙어 있다.)
[mounts]
  source = "collector_data"
  destination = "/data"

# 실시간 점수 JSON 만 내보내는 통로. 수집기가 죽으면 안 되므로
# auto_stop 은 끈다 — 잠들면 수집도 같이 멈춘다.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  # ⚠️ 512mb 로는 **부족했다.** 수집만 하는 게 아니라 PUBLISH 가 산출물을 만든다.
  #    games.csv 25MB · bets.csv 30MB(391,235행)를 pandas 로 여러 번 통째로 읽는데
  #    (loss_filter 2회 · combo 2회), 512mb 에서 `Out of memory: Killed process` 로
  #    죽었다(2026-07-31 00:40:45Z 로그 확인). 산출물 생성이 7단계에서 끊겨
  #    loss_grades·combo·today_combo 가 하루 넘게 낡은 채로 있었다.
  memory = "1gb"
